services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    env_file: ./hermes.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./hermes:/opt/data
      - ./pipeline/export/hermes:/opt/pipeline_export:ro
    mem_limit: 2g
    cpus: 1.0
    command: ["gateway", "run"]
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID", "KILL"]
