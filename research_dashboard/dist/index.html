<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>전략 연구 현황판</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three-r160/three.module.js"}}</script></head>
<body><div id="graph" aria-label="전략 3차원 연결 화면"></div><div id="labels"></div>
<aside class="settings glass open"><div class="settings-heading"><button id="settings-toggle" class="panel-title"><span id="settings-title"></span><b>−</b></button><button id="theme" class="theme-button"></button></div><div id="settings-body">
<details open><summary id="display-title"></summary><p>크기 기준: <b>검증 통과 횟수</b></p><label>색 기준<select id="color-mode"><option value="cluster">군집</option><option value="verdict">판정</option></select></label><label>글로우 세기<input id="glow" type="range" min="0" max="2" step="0.1" value="1.4"></label><label>노드 크기<input id="node-scale" type="range" min="0.4" max="2" step="0.1" value="1"></label></details>
<details><summary id="labels-title"></summary><label>표시 거리<input id="label-distance" type="range" min="180" max="900" step="20" value="420"></label><label><input id="labels-on" type="checkbox" checked> 이름 표시</label></details>
<details><summary id="links-title"></summary><label><input id="links-on" type="checkbox" checked> 연결 표시</label><label>굵기<input id="edge-width" type="range" min="0.3" max="3" step="0.1" value="1"></label><label>불투명도<input id="edge-opacity" type="range" min="0.05" max="1" step="0.05" value="0.5"></label><label id="strength-label"></label><input id="strength" type="range" min="0" max="0.9" step="0.05" value="0"><p id="edge-note"></p><p id="edge-threshold"></p></details>
<details><summary>3차원 보기</summary><button id="flat"></button><button id="reset"></button></details>
<details><summary>물리</summary><label>밀집도 반발력<input id="repulsion" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>연결력<input id="attraction" type="range" min="0.5" max="2" step="0.1" value="1"></label></details>
<details open><summary id="clusters-title"></summary><div id="cluster-legend"></div></details>
<p id="controls-note"></p>
</div></aside>
<div class="top-ui"><div class="filters glass"><input id="search" type="search" autocomplete="off"><button id="filter-toggle" class="filter-toggle" aria-expanded="false">검색·필터 <b>＋</b></button><label><span id="family-label"></span><select id="family"></select></label><label><span id="timeframe-label"></span><select id="timeframe"></select></label><label><span id="verdict-label"></span><select id="verdict"></select></label><label><span id="symbol-label"></span><select id="symbol"></select></label><button id="reset-filters"></button></div><div class="status-pills"><strong id="headline"></strong><strong id="confirmed"></strong></div><section id="forward" class="forward-grid glass"></section></div>
<aside class="list-panel glass open"><button id="list-toggle" class="panel-title"><span id="list-title"></span><b>−</b></button><div id="results"></div></aside>
<aside id="detail" class="detail glass" hidden><button id="detail-close" class="close"></button><div id="detail-body"></div></aside>
<div id="layout-status" aria-live="polite"></div><p id="empty" hidden></p><p id="webgl-error" hidden></p><div id="stats" class="stats glass"></div><script type="module" src="app.js"></script></body></html>
